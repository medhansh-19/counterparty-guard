name: API and reputation checks
on:
  push:
    branches: [main, 'feat/a-*', 'feat/c-*', 'feat/b-*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: person-a-${{ github.ref }}
  cancel-in-progress: true
jobs:
  person-a:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.25.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm verify:interfaces
      - run: pnpm setup:local
      - run: pnpm smoke:api
      - run: pnpm build
      - run: pnpm demo:attack -- --log-file artifacts/demo/attack.jsonl
      - run: pnpm demo:fixtures -- --scenario S1 --json --log-file artifacts/demo/allow.jsonl

  person-b:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 11.25.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: rustup show
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: pnpm test:e2e
