[workspace]
members = ["contracts/vault", "contracts/receiver-fixture", "contracts/integration-tests"]
resolver = "2"

[workspace.dependencies]
near-sdk = "=5.30.1"
borsh = "=1.7.0"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
hex = "=0.4.3"
base64 = "=0.22.1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
panic = "abort"
overflow-checks = true
strip = true
